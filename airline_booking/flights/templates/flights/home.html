
{% extends "flights/base.html" %}
{% load static %}
{% block title %}Пошук рейсів — Авіаквитки{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4 text-center">Знайдіть свій рейс</h1>
                <form method="get" action="{% url 'flights:flight_list' %}">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="{{ form.from_city.id_for_label }}" class="form-label">
                                {{ form.from_city.label }}
                            </label>
                            {{ form.from_city }}
                        </div>
                        <div class="col-md-4">
                            <label for="{{ form.to_city.id_for_label }}" class="form-label">
                                {{ form.to_city.label }}
                            </label>
                            {{ form.to_city }}
                        </div>
                        <div class="col-md-4">
                            <label for="{{ form.date.id_for_label }}" class="form-label">
                                {{ form.date.label }}
                            </label>
                            {{ form.date }}
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Знайти рейси
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="{% url 'flights:flight_list' %}" class="text-decoration-none">
                Або переглянути всі рейси →
            </a>
        </div>
    </div>
</div>
{% endblock %}
